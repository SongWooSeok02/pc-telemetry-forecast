name: telemetry-dev
x-app: &app
  build:
    context: ..
    dockerfile: infra/Dockerfile
  environment:
    # Empty DSN lets libpq consume PG* without URI-encoding the password.
    DATABASE_URL: ''
    PGHOST: db
    PGUSER: ${POSTGRES_USER:?set POSTGRES_USER}
    PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB}
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - dev-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - ../database/migrations:/migrations:ro
    command: [psql, -v, ON_ERROR_STOP=1, -f, /migrations/001_ingestion.sql, -f, /migrations/002_registration.sql, -f, /migrations/003_quality.sql]
    restart: 'no'
  api:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports: ['127.0.0.1:8000:8000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/partitions', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
  partitions:
    <<: *app
    profiles: [maintenance]
    depends_on:
      db:
        condition: service_healthy
    command: [python, -m, backend.partitions]
    restart: 'no'
volumes:
  dev-db:
