name: telemetry-prod
x-app: &app
  image: telemetry-backend:${TELEMETRY_REVISION:?set TELEMETRY_REVISION}
  build:
    context: ..
    dockerfile: infra/Dockerfile
  environment:
    DATABASE_URL: ''
    PGHOST: db
    PGDATABASE: telemetry
    PGUSER: telemetry_app
    PGPASSFILE: /run/secrets/app_pgpass
    PGCONNECT_TIMEOUT: '5'
  secrets: [app_pgpass]
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  networks: [data]

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [admin_password, bootstrap_pgpass]
    volumes:
      - db:/var/lib/postgresql/data
      - ./prod/bootstrap.sh:/docker-entrypoint-initdb.d/01-role.sh:ro
    healthcheck:
      test: [CMD, pg_isready, -h, '127.0.0.1', -U, telemetry_admin, -d, telemetry]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [data]
  api:
    <<: *app
    networks: [data, edge]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/partitions', timeout=6)"]
      interval: 15s
      timeout: 8s
      retries: 4
  aggregation:
    <<: *app
    command: [python, -m, backend.aggregation]
  forecast:
    <<: *app
    command: [python, -m, backend.forecast]
    volumes:
      - type: bind
        source: ${TELEMETRY_MODELS:?set TELEMETRY_MODELS}
        target: /models
        read_only: true
        bind:
          create_host_path: false
  proxy:
    image: caddy:2
    environment:
      TELEMETRY_DOMAIN: ${TELEMETRY_DOMAIN:?set TELEMETRY_DOMAIN}
    ports:
      - '${TELEMETRY_BIND_IP:-0.0.0.0}:80:80'
      - '${TELEMETRY_BIND_IP:-0.0.0.0}:443:443'
    volumes:
      - ./prod/Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy-data:/data
      - proxy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [edge]

secrets:
  admin_password:
    file: ${TELEMETRY_ADMIN_PASSWORD_FILE:?set TELEMETRY_ADMIN_PASSWORD_FILE}
  app_pgpass:
    file: ${TELEMETRY_APP_PGPASS_FILE:?set TELEMETRY_APP_PGPASS_FILE}
  bootstrap_pgpass:
    file: ${TELEMETRY_BOOTSTRAP_PGPASS_FILE:?set TELEMETRY_BOOTSTRAP_PGPASS_FILE}
volumes:
  db:
  proxy-data:
  proxy-config:
networks:
  edge:
  data:
    internal: true
