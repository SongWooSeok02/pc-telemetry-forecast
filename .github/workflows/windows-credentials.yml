name: S2-03 Windows credential boundary
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  credentials:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./tests/run_windows_credentials.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s2-03-windows-evidence
          path: tests/results/s2-03-windows.json
          if-no-files-found: error
