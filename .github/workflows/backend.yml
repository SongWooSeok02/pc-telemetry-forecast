name: S1-03 PostgreSQL ingestion
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: telemetry_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@localhost:5432/telemetry_test
      BACKEND_REPORT: tests/results/ci/s1-03-postgres.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -p test_backend_runner.py
      - run: python -m unittest discover -s tests -p test_partitions.py
      - run: python tests/run_backend.py
      - run: python tests/run_registration.py
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1-03-postgres-evidence
          path: |
            tests/results/ci/s1-03-postgres.json
            tests/results/s2-03-registration.json
          if-no-files-found: error
